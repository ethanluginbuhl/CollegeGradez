name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $expected = "v$((Get-Content package.json | ConvertFrom-Json).version)"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} does not match package version $expected."
          }
      - name: Build release artifacts
        run: npm run dist -- --publish never
      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $assets = @(
            "release/CollegeGradez-Setup-$version.exe",
            "release/CollegeGradez-Setup-$version.exe.blockmap",
            "release/latest.yml"
          )
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --repo $repo --clobber
            gh release edit $tag --repo $repo `
              --title "CollegeGradez $tag" --prerelease
          } else {
            gh release create $tag $assets --repo $repo `
              --title "CollegeGradez $tag" --prerelease --generate-notes
          }
