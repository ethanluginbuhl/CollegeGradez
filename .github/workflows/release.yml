name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $expected = "v$version"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} does not match package version $expected."
          }
          node scripts\check-release-channel.js $version
          if ($LASTEXITCODE -ne 0) {
            throw "Release version '$version' uses an unsupported prerelease channel."
          }
      - name: Build release artifacts
        run: npm run dist -- --publish never
      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $isPrerelease = (node -p "require('./update-manager').isPrereleaseVersion(require('./package.json').version)") -eq "true"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not determine the release channel."
          }
          $prereleaseOption = "--prerelease=$($isPrerelease.ToString().ToLowerInvariant())"
          $assets = @(
            "release/CollegeGradez-Setup-$version.exe",
            "release/CollegeGradez-Setup-$version.exe.blockmap",
            "release/latest.yml"
          )
          $notesFile = ".github/release-notes/$tag.md"
          $releaseOptions = @("--title", "CollegeGradez $tag", $prereleaseOption)
          if (Test-Path $notesFile) {
            $releaseOptions += @("--notes-file", $notesFile)
          }
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Could not upload release assets for $tag."
            }
            gh release edit $tag --repo $repo @releaseOptions
          } else {
            if (-not (Test-Path $notesFile)) {
              $releaseOptions += "--generate-notes"
            }
            gh release create $tag $assets --repo $repo @releaseOptions
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create or update release $tag."
          }
