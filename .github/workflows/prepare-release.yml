name: Prepare Release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example 1.0.0 or 1.1.0-beta.1)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update package version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:RELEASE_VERSION.Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Version '$version' is not a valid npm semver without a leading v."
          }
          node scripts\check-release-channel.js $version
          if ($LASTEXITCODE -ne 0) {
            throw "Release version '$version' uses an unsupported prerelease channel."
          }
          npm version $version --no-git-tag-version --allow-same-version

      - name: Generate release notes draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:RELEASE_VERSION.Trim()
          $tag = "v$version"
          $branch = "release/prepare-$tag-${{ github.run_id }}"
          $repo = "${{ github.repository }}"
          $generated = gh api --method POST "repos/$repo/releases/generate-notes" `
            -f tag_name=$tag -f target_commitish="${{ github.sha }}" | ConvertFrom-Json
          $notesPath = ".github/release-notes/$tag.md"
          New-Item -ItemType Directory -Force (Split-Path $notesPath) | Out-Null
          @(
            "# $($generated.name)"
            ""
            "<!-- Review these generated notes before creating the release. -->"
            ""
            $generated.body
          ) | Set-Content -Path $notesPath -Encoding utf8
          npx prettier --write $notesPath
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_BRANCH=$branch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build unpacked application
        run: npm run dist:dir

      - name: Create release preparation pull request
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c $env:RELEASE_BRANCH
          git add package.json package-lock.json ".github/release-notes/$env:RELEASE_TAG.md"
          git commit -m "chore: prepare release $env:RELEASE_TAG"
          git push --set-upstream origin $env:RELEASE_BRANCH
          $prBody = @"
          ## Release preparation

          Version: $env:RELEASE_VERSION

          Generated release notes are included for review. After merging, test
          the packaged application and push $env:RELEASE_TAG to publish the
          release.
          "@
          gh pr create --base "${{ github.ref_name }}" --head $env:RELEASE_BRANCH `
            --title "Prepare release $env:RELEASE_TAG" `
            --body $prBody
