name: Bug report
description: Report a reproducible problem with CollegeGradez.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include real grade data, exported backups, credentials, or other personal information.
        For a security vulnerability, follow SECURITY.md instead of opening a public issue.
  - type: input
    id: version
    attributes:
      label: CollegeGradez version
      description: Which release or commit are you using?
      placeholder: 0.2.0-beta.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
